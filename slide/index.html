<!doctype html>
<html lang="th">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="">
  <title>Loading…</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css">
</head>

<body>
  <main class="presentation" aria-label="สไลด์แนะนำตัว">
    <header class="presentation-header">
      <div class="header-left">
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="สลับธีม">
          <svg viewBox="0 0 24 24" class="icon-sun" aria-hidden="true">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg viewBox="0 0 24 24" class="icon-moon" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a class="wordmark" href="#" id="wordmarkLink" aria-label="กลับไปยังสไลด์แรก"></a>
        <span class="header-eyebrow" id="slideEyebrow" aria-live="polite"></span>
      </div>
      <p class="slide-count" aria-live="polite">
        <span id="currentSlide">01</span><span aria-hidden="true"> / </span><span id="totalSlides">--</span>
      </p>
    </header>

    <div class="slides-viewport" aria-live="polite">
      <div class="slides-track" id="slidesTrack">
        <!-- สไลด์ทั้งหมดจะถูก inject โดย script.js -->
      </div>
    </div>

    <footer class="presentation-footer">
      <div class="slide-controls">
        <button class="nav-button" id="prevButton" type="button" aria-label="สไลด์ก่อนหน้า">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m14.5 5-7 7 7 7"></path>
          </svg>
        </button>
        <div class="progress-dots" id="progressDots" aria-label="เลือกสไลด์"></div>
        <button class="nav-button" id="nextButton" type="button" aria-label="สไลด์ถัดไป">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="m9.5 5 7 7-7 7"></path>
          </svg>
        </button>
      </div>
    </footer>
  </main>

  <!-- Modal สำหรับขยายการ์ดโปรเจกต์ -->
  <dialog id="projectModal" class="project-modal" aria-label="รายละเอียดผลงาน">
    <div class="modal-content" id="projectModalContent"></div>
    <button type="button" class="modal-close" id="projectModalClose" aria-label="ปิดหน้าต่าง">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18 6L6 18M6 6l12 12"></path>
      </svg>
    </button>
  </dialog>

  <script src="./js/script.js" defer></script>
</body>

</html>
