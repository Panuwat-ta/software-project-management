[pytest]
pythonpath = .
# เฉพาะชุดทดสอบที่ใช้งานจริง (ไฟล์ snapshot ของ Phase1-4 เป็นหลักฐาน
# ประวัติการทำงาน จึงไม่ collect)
testpaths =
    test_app.py
    test_program.py

# โฟลเดอร์เก็บหลักฐานเก่า (rename ไปแล้ว ไม่ต้อง scan)
norecursedirs =
    Phase1
    Phase2
    Phase3
    Phase4
    .git
    .agents
    work
    __pycache__

addopts =
    --import-mode=importlib
    -q